<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>深渊回响 · 技能试验场</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden; }
  body {
    -webkit-user-select: none; user-select: none;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #dfe8f5;
  }
  canvas#game { display: block; width: 100%; height: 100%; cursor: crosshair; }

  /* ---------------- 控制面板 ---------------- */
  #lab {
    position: fixed; top: 0; right: 0; width: 344px; height: 100%;
    box-sizing: border-box; padding: 12px 14px 28px;
    background: linear-gradient(180deg, rgba(9, 13, 22, .95), rgba(5, 8, 14, .97));
    border-left: 1px solid rgba(142, 203, 255, .16);
    box-shadow: -18px 0 38px rgba(0, 0, 0, .45);
    overflow-y: auto; z-index: 10; font-size: 12px;
    transition: transform .22s ease;
  }
  #lab.hidden { transform: translateX(105%); }
  #lab::-webkit-scrollbar { width: 8px; }
  #lab::-webkit-scrollbar-thumb { background: rgba(142, 203, 255, .18); border-radius: 4px; }

  .lab-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .lab-head b { font-size: 15px; letter-spacing: .5px; color: #eaf3ff; }
  .lab-head .sub { display: block; font-size: 10px; color: #5d6b82; letter-spacing: 2px; margin-top: 2px; }
  .lab-head .links { display: flex; gap: 6px; align-items: center; }

  .sec { margin: 0 0 12px; }
  .sec-title {
    font-size: 11px; color: #7c8ba3; letter-spacing: 1px;
    margin: 0 0 6px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .sec-title span { color: #48566b; letter-spacing: 0; }

  .btns { display: flex; flex-wrap: wrap; gap: 6px; }

  button {
    font-family: inherit; font-size: 12px; color: #c9d7ea; cursor: pointer;
    background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 6px; padding: 5px 9px; line-height: 1.2;
    transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: rgba(142, 203, 255, .12); border-color: rgba(142, 203, 255, .32); color: #eaf3ff; }
  button.active {
    background: rgba(255, 209, 102, .14); border-color: rgba(255, 209, 102, .6);
    color: #ffe9a8; box-shadow: 0 0 10px rgba(255, 209, 102, .12) inset;
  }
  button.primary { background: rgba(142, 203, 255, .16); border-color: rgba(142, 203, 255, .42); color: #eaf3ff; }
  button.primary:hover { background: rgba(142, 203, 255, .26); }
  button.mini { padding: 4px 7px; font-size: 11px; }
  a { color: #8ecbff; text-decoration: none; font-size: 12px; }
  a:hover { text-decoration: underline; }

  .skill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .skill {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 7px 4px 6px; border-radius: 8px; background: rgba(255, 255, 255, .035);
    border: 1px solid rgba(255, 255, 255, .07); color: #c9d7ea; cursor: pointer;
    transition: background .15s, border-color .15s, transform .08s;
  }
  .skill:hover { background: rgba(255, 255, 255, .075); border-color: rgba(142, 203, 255, .35); }
  .skill:active { transform: scale(.97); }
  .skill.active {
    background: color-mix(in srgb, var(--c, #8ecbff) 18%, transparent);
    border-color: var(--c, #8ecbff);
    box-shadow: 0 0 12px color-mix(in srgb, var(--c, #8ecbff) 35%, transparent);
    color: #fff;
  }
  .skill .ico { font-size: 16px; line-height: 1.1; }
  .skill .nm { font-size: 11px; }
  .skill .tag { font-size: 9px; color: #6f7f96; }
  .skill.active .tag { color: rgba(255, 255, 255, .72); }

  .slider { display: block; margin-top: 8px; font-size: 11px; color: #8b9ab1; }
  .slider input[type=range] {
    width: 100%; margin: 4px 0 0; height: 16px; accent-color: #8ecbff;
    background: transparent;
  }
  .slider span { float: right; color: #cfe0f7; }

  .stats { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 3px 8px; font-size: 11px; }
  .stats span { color: #6f7f96; }
  .stats b { color: #cfe0f7; font-weight: 600; }
  .stats em { color: #ffd166; font-style: normal; }

  .dps { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 8px; margin-top: 8px;
         padding: 7px 8px; border-radius: 7px; background: rgba(142, 203, 255, .07);
         border: 1px solid rgba(142, 203, 255, .14); font-size: 11px; }
  .dps span { color: #7c8ba3; }
  .dps b { color: #eaf3ff; font-weight: 600; text-align: right; }
  .dps b.big { color: #ffd166; }

  .hint { margin-top: 8px; font-size: 10px; line-height: 1.6; color: #55637a; }
  .hint kbd {
    font-family: inherit; font-size: 10px; padding: 1px 4px; border-radius: 3px;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .1); color: #a9bad0;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="lab">
  <div class="lab-head">
    <div>
      <b>技能试验场</b>
      <span class="sub">SKILL LAB</span>
    </div>
    <div class="links">
      <button id="lab-hide" class="mini" title="快捷键 H">隐藏</button>
      <a href="index.html">回游戏</a>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">职业</div>
    <div class="btns" id="lab-class"></div>
  </div>

  <div class="sec">
    <div class="sec-title">技能 <span id="lab-skill-count"></span></div>
    <div class="skill-grid" id="lab-skills"></div>
  </div>

  <div class="sec">
    <div class="sec-title">技能等级</div>
    <div class="btns" id="lab-level"></div>
  </div>

  <div class="sec">
    <div class="btns">
      <button id="lab-once" class="primary">施放一次</button>
      <button id="lab-auto" class="toggle">自动施放</button>
      <button id="lab-rotate" class="toggle">轮播全部</button>
    </div>
    <label class="slider">自动间隔 <span id="lab-interval-v">1.2s</span>
      <input type="range" id="lab-interval" min="0.3" max="4" step="0.1" value="1.2">
    </label>
    <label class="slider">时间流速 <span id="lab-speed-v">1.00×</span>
      <input type="range" id="lab-speed" min="0.1" max="1.5" step="0.05" value="1">
    </label>
  </div>

  <div class="sec">
    <div class="sec-title">木桩</div>
    <div class="btns" id="lab-targets">
      <button data-target="ring">假人环</button>
      <button data-target="single">近身木桩</button>
      <button data-target="boss">Boss 木桩</button>
      <button data-target="none">清空</button>
    </div>
    <div class="btns" id="lab-bosstier" style="margin-top:6px"></div>
    <div class="btns" style="margin-top:6px">
      <button id="lab-immortal" class="toggle active">木桩不死</button>
      <button id="lab-displace">位移演示</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">场景 / 形象</div>
    <div class="btns" id="lab-scene"></div>
    <div class="btns" id="lab-skin" style="margin-top:6px"></div>
  </div>

  <div class="sec">
    <div class="sec-title">帧控制</div>
    <div class="btns">
      <button id="lab-pause">暂停</button>
      <button id="lab-step">单步</button>
      <button id="lab-fx">清特效</button>
      <button id="lab-lowfx" class="toggle">低特效</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">当前技能数值</div>
    <div id="lab-stats" class="stats"></div>
    <div id="lab-dps" class="dps"></div>
    <div class="hint">
      <kbd>空格</kbd> 冲锋 / 闪现（朝鼠标）· <kbd>H</kbd> 收起面板 ·
      <kbd>P</kbd> 暂停 · 点击技能卡切换，<kbd>施放一次</kbd> 立即触发
    </div>
  </div>
</div>

<script src="js/content.js"></script>
<script src="js/talents.js"></script>
<script src="js/core.js"></script>
<script src="js/vfx.js"></script>
<script src="js/entities.js"></script>
<script src="js/systems.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/lab.js"></script>
</body>
</html>
